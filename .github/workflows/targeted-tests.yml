name: Targeted Tests

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest -r requirements.txt

      - name: Detect affected tests
        id: select
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi

          OUTPUT="$(python .github/scripts/select_tests.py --base "$BASE" --head "$HEAD")"

          {
            echo "targets<<EOF"
            printf '%s\n' "$OUTPUT"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Run pytest
        shell: bash
        env:
          TARGETS: ${{ steps.select.outputs.targets }}
        run: |
          if [ -z "$TARGETS" ]; then
            echo "No Python code changes detected; skipping pytest."
            exit 0
          fi

          if [ "$TARGETS" = "ALL" ]; then
            echo "Running the full test suite."
            python -m pytest -q
            exit 0
          fi

          echo "Running targeted tests:"
          printf '%s\n' "$TARGETS"

          if ! python -m pytest -q $TARGETS; then
            echo "::error::Targeted tests failed. Fix the failing tests before pushing again."
            exit 1
          fi
